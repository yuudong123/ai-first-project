# 독립 실행 파일. 기존 docker-compose.yml과 합치지 않는다.
name: hydrotwin-multi

x-app: &app
  image: hydrotwin-server:${HYDROTWIN_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: infra/Dockerfile.server
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  inference:
    <<: *app
    command: [python, -m, src.runtime.server_entry, inference]
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER:?Kafka 접속 주소를 설정하세요}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hydraulic.sensor.multi.raw}
    volumes:
      - type: bind
        source: ${MODEL_HOST_DIR:?models 디렉터리의 절대 경로를 설정하세요}
        target: /app/models
        read_only: true
        bind: {create_host_path: false}
      - runtime:/app/artifacts/runtime
    mem_limit: 1g

  api:
    <<: *app
    command: [python, -m, src.runtime.server_entry, api]
    environment:
      HYDROTWIN_RUNTIME: "1"
      HYDROTWIN_REMOTE: "1"
      UNITY_WEBGL_PATH: /unity-build
    volumes:
      - runtime:/app/artifacts/runtime:ro
      - type: bind
        source: ${DATA_HOST_DIR:?data 디렉터리의 절대 경로를 설정하세요}
        target: /app/data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${UNITY_WEBGL_HOST_PATH:?Unity 빌드 디렉터리의 절대 경로를 설정하세요}
        target: /unity-build
        read_only: true
        bind: {create_host_path: false}
    ports: ["${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"]
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3

volumes:
  runtime:
