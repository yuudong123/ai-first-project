<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유압 시스템 모니터링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="chart.umd.js"></script>
<style>
  :root{
    --bg-base:#0a0f14;
    --bg-panel:#0f161d;
    --bg-panel-2:#131b23;
    --border:#22303b;
    --border-soft:#1a2530;
    --text-primary:#e6edf3;
    --text-secondary:#7c8e9c;
    --text-dim:#4d5c68;
    --accent:#2fe0c4;
    --accent-dim:rgba(47,224,196,0.12);
    --normal:#34d399;
    --caution:#fbbf24;
    --warning:#fb923c;
    --danger:#f87171;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans KR', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:var(--bg-base);
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
    line-height:1.5;
    scrollbar-width:none;       /* Firefox */
    -ms-overflow-style:none;    /* 구형 Edge/IE */
  }
  body::-webkit-scrollbar{ display:none; }  /* Chrome/Safari/Edge */

  /* ---------- 헤더 ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:20px 28px;
    border-bottom:1px solid var(--border-soft);
  }
  .title-block{ display:flex; align-items:baseline; gap:14px; }
  .title-block h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:20px;
    letter-spacing:-0.01em;
  }
  .title-block span{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
  }

  /* ---------- 헤더 가운데 지표 ---------- */
  .header-metrics{
    display:flex;
    gap:32px;
    align-items:baseline;
  }
  .metric{ display:flex; align-items:baseline; gap:8px; }
  .metric-value{
    font-family:var(--font-mono);
    font-size:20px;
    color:var(--text-primary);
    line-height:1;
  }
  .metric-label{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
  }
  @media (max-width:1100px){
    .header-metrics{ display:none; }  /* 좁은 화면에선 헤더가 복잡해지니 숨김 */
  }
  .status-cluster{ display:flex; align-items:center; gap:20px; }
  .status-item{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-secondary);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--text-dim);
    transition:background .3s;
  }
  .dot.live{
    background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim);
  }
  .dot.risk-danger{ background:var(--danger); box-shadow:0 0 0 3px rgba(248,113,113,0.15); }

  /* ---------- 레이아웃 ---------- */
  /* 사이드바 너비와 차트 높이는 드래그로 조절되며, 값은 아래 CSS 변수로 관리한다 */
  main{
    display:grid;
    grid-template-columns:1fr 6px var(--side-width, 340px);
    gap:0;
    background:var(--border-soft);
  }
  @media (max-width:900px){
    main{ grid-template-columns:1fr; }
    .col-resizer{ display:none; }
  }

  /* 사이드바 너비 조절 손잡이 (좌우 드래그) */
  .col-resizer{
    background:var(--bg-panel);
    border-left:1px solid var(--border-soft);
    border-right:1px solid var(--border-soft);
    cursor:col-resize;
    position:relative;
    transition:background .15s;
  }
  .col-resizer:hover,
  .col-resizer.dragging{ background:var(--accent-dim); }
  /* 얇은 선이라 잡기 어려우므로, 보이지 않는 여유 영역을 좌우로 넓혀준다 */
  .col-resizer::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:-6px; right:-6px;
  }
  /* 잡는 곳임을 알려주는 점선 그립 */
  .col-resizer::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:2px; height:30px;
    transform:translate(-50%,-50%);
    border-radius:1px;
    background:repeating-linear-gradient(
      to bottom,
      var(--text-secondary) 0 2px,
      transparent 2px 5px
    );
    pointer-events:none;
  }
  .col-resizer:hover::after,
  .col-resizer.dragging::after{
    background:repeating-linear-gradient(
      to bottom,
      var(--accent) 0 2px,
      transparent 2px 5px
    );
  }

  /* 드래그 중에는 텍스트 선택이나 커서 깜빡임이 생기지 않도록 */
  body.resizing{ user-select:none; }
  body.resizing-col, body.resizing-col *{ cursor:col-resize !important; }

  .panel{ background:var(--bg-base); padding:24px; }
  .panel-title{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.04em;
    margin-bottom:16px;
  }

  /* ---------- 사이드바: 텔레메트리 ---------- */
  .side-panel{
    background:var(--bg-base);
    border-left:1px solid var(--border-soft);
    /* 사이드바를 넓히면 Unity 패널(16:9)이 낮아져 행 높이가 줄어드는데,
       그때 사이드바 내용이 잘리지 않도록 최소 높이를 확보하고 넘치면 스크롤한다 */
    min-height:520px;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:var(--border) transparent;
  }
  .side-panel::-webkit-scrollbar{ width:6px; }
  .side-panel::-webkit-scrollbar-track{ background:transparent; }
  .side-panel::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
  .side-panel::-webkit-scrollbar-thumb:hover{ background:var(--text-dim); }
  .section{ padding:22px 24px; border-bottom:1px solid var(--border-soft); }
  .section-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:14px;
  }
  .section-header h2{
    font-family:var(--font-display);
    font-size:14px; font-weight:600;
  }
  .section-header .count{
    font-family:var(--font-mono);
    font-size:11px; color:var(--accent);
  }

  .telemetry-list{
    display:flex; flex-direction:column; gap:4px;
    max-height:var(--telemetry-height, 280px);
    overflow-y:auto;
    /* 스크롤바가 값 텍스트를 가리지 않도록 오른쪽에 여백 확보 */
    padding-right:10px;
    scrollbar-width:thin;                        /* Firefox */
    scrollbar-color:var(--border) transparent;   /* Firefox: 막대 / 트랙 */
  }
  /* Chrome/Safari/Edge 스크롤바 */
  .telemetry-list::-webkit-scrollbar{ width:6px; }
  .telemetry-list::-webkit-scrollbar-track{ background:transparent; }
  .telemetry-list::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:3px;
  }
  .telemetry-list::-webkit-scrollbar-thumb:hover{ background:var(--text-dim); }

  /* 센서 행: 클릭하면 해당 센서 그래프로 전환 */
  .telemetry-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px;
    padding:5px 8px;
    border-radius:5px;
    cursor:pointer;
    border-left:2px solid transparent;
    transition:background .15s, border-color .15s;
  }
  .telemetry-row:hover{ background:var(--bg-panel); }
  .telemetry-row:focus-visible{
    outline:none;
    background:var(--bg-panel);
    border-left-color:var(--text-dim);
  }
  .telemetry-row.selected{
    background:var(--accent-dim);
    border-left-color:var(--accent);
  }
  .telemetry-row.selected .name{ color:var(--accent); }
  .telemetry-row .name{ color:var(--text-secondary); transition:color .15s; }
  .telemetry-row .val{ font-family:var(--font-mono); color:var(--text-primary); }

  .diag-list{
    display:flex; flex-direction:column; gap:10px;
    /* 예측 결과가 아직 없을 때도 영역이 유지되도록 최소 높이 확보 */
    min-height:120px;
  }
  .diag-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 10px;
    background:var(--bg-panel);
    border-radius:6px;
    border:1px solid var(--border-soft);
  }
  .diag-row .name{ font-size:12.5px; color:var(--text-secondary); }
  .diag-row .state{ display:flex; align-items:center; gap:7px; }
  .diag-row .state-text{ font-family:var(--font-mono); font-size:11.5px; }
  .diag-meta{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--text-dim);
    padding-left:2px;
  }
  .badge{
    width:7px; height:7px; border-radius:50%;
  }
  .badge.risk-normal{ background:var(--normal); }
  .badge.risk-caution{ background:var(--caution); }
  .badge.risk-warning{ background:var(--warning); }
  .badge.risk-danger{ background:var(--danger); }
  .state-text.risk-normal{ color:var(--normal); }
  .state-text.risk-caution{ color:var(--caution); }
  .state-text.risk-warning{ color:var(--warning); }
  .state-text.risk-danger{ color:var(--danger); }

  .conf-bar-track{ width:100%; height:2px; background:var(--border-soft); border-radius:2px; margin-top:6px; }
  .conf-bar-fill{ height:100%; border-radius:2px; background:var(--text-dim); transition:width .4s; }

  /* ---------- 하단 추이 차트 ---------- */
  .trend-panel{
    grid-column:1 / -1;
    background:var(--bg-base);
    padding:24px 28px 28px;
    border-top:1px solid var(--border-soft);
  }
  .chart-wrap{ height:220px; }

  .empty-state{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    text-align:center;
    padding:40px 0;
  }

  /* ---------- Unity WebGL 패널 ---------- */
  .unity-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:8px;
    border:1px solid var(--border-soft);
    overflow:hidden;
  }
  #unity-canvas{
    width:100%; height:100%; display:block;
  }
  .unity-status{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    background:rgba(10,15,20,0.85);
    pointer-events:none;
    transition:opacity .3s;
  }
  .unity-status.hidden{ opacity:0; }
  .unity-status.error{ color:var(--warning); }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>유압 시스템 모니터링</h1>
    <span id="unit-label">HYDRAULIC UNIT 01</span>
  </div>

  <div class="header-metrics">
    <div class="metric">
      <span class="metric-value" id="elapsed-sec">—</span>
      <span class="metric-label">경과 시간 (sec)</span>
    </div>
    <div class="metric">
      <span class="metric-value" id="poll-count">0</span>
      <span class="metric-label">수신 횟수</span>
    </div>
  </div>

  <div class="status-cluster">
    <div class="status-item"><span>예측 윈도우 <span id="cycle-id">—</span></span></div>
    <div class="status-item"><span id="update-age">데이터 대기 중</span></div>
    <div class="status-item">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">연결 확인 중</span>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-title">3D 디지털 트윈 (Unity)</div>
    <div class="unity-wrap">
      <canvas id="unity-canvas" width="960" height="540"></canvas>
      <div id="unity-status" class="unity-status">Unity 로딩 중...</div>
    </div>
  </section>

  <div class="col-resizer" id="col-resizer" role="separator" aria-orientation="vertical"
       aria-label="사이드바 너비 조절" title="왼쪽으로 드래그해서 넓히기 (더블클릭: 기본 너비)"></div>

  <aside class="side-panel">
    <div class="section">
      <div class="section-header">
        <h2>실시간 센서 현황</h2>
        <span class="count" id="sensor-count">17 채널</span>
      </div>
      <div class="telemetry-list" id="telemetry-list">
        <div class="empty-state">데이터 수신 대기 중</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>AI 진단</h2>
      </div>
      <div class="diag-list" id="diag-list">
        <div class="empty-state">예측 결과 대기 중</div>
      </div>
    </div>
  </aside>

  <section class="trend-panel">
    <div class="panel-title" id="chart-title">CE 추이 (%)</div>
    <div class="chart-wrap">
      <canvas id="trend-chart"></canvas>
    </div>
  </section>
</main>

<script>
const API_BASE = "http://127.0.0.1:8000";
const POLL_INTERVAL_MS = 1000;
const MAX_HISTORY = 30;
const STALE_MS = 4000; // event_id가 이만큼(ms) 안 바뀌면 "데이터 지연"으로 간주

// ---------- Unity WebGL 연동 설정 ----------
// Build 폴더를 web/index.html과 같은 위치(web/Build/)에 복사해서 넣어야 함.
// 실제 파일명: pro-build.loader.js, pro-build.data.gz, pro-build.framework.js.gz, pro-build.wasm.gz
const UNITY_BUILD_FOLDER = "Build";
const UNITY_OBJECT_NAME = "_App";
const UNITY_METHOD_NAME = "ApplyState";
const UNITY_CLEAR_METHOD = "ClearState";
let unityInstance = null;

const SENSOR_ORDER = ["PS1","PS2","PS3","PS4","PS5","PS6","EPS1","FS1","FS2","TS1","TS2","TS3","TS4","VS1","CE","CP","SE"];
const SENSOR_UNITS = {
  PS1:"bar", PS2:"bar", PS3:"bar", PS4:"bar", PS5:"bar", PS6:"bar",
  EPS1:"W", FS1:"l/min", FS2:"l/min",
  TS1:"°C", TS2:"°C", TS3:"°C", TS4:"°C",
  VS1:"mm/s", CE:"%", CP:"kW", SE:"%",
};

const RISK_LABEL = { normal:"정상", caution:"주의", warning:"경고", danger:"위험" };
const COMPONENT_LABEL = { pump:"펌프", valve:"밸브", cooler:"쿨러", accumulator:"어큐뮬레이터" };

// ---------- 설비 선택 (Unity 3D 화면에서 머신 클릭 시 연동) ----------
const EQUIPMENT_IDS = ["station-01", "station-02", "station-03"];
let selectedEquipmentId = "station-01";

let receivedCount = 0;   // 데이터가 실제로 갱신된 횟수 (같은 값 반복은 카운트 안 함)
let chart = null;
let lastChangeAt = Date.now();
const PAGE_START = Date.now();

// 설비별 × 센서별로 이력을 따로 쌓아둔다.
// 설비나 센서를 바꿔도 그동안 쌓인 이력이 그대로 보이도록 하기 위함.
const histories = {};
function makeHistory(){
  const h = { labels: [], sensors: {} };
  SENSOR_ORDER.forEach(name => { h.sensors[name] = []; });
  return h;
}
EQUIPMENT_IDS.forEach(id => { histories[id] = makeHistory(); });

function currentHistory(){
  if (!histories[selectedEquipmentId]) histories[selectedEquipmentId] = makeHistory();
  return histories[selectedEquipmentId];
}

let selectedSensor = "CE";  // 기본으로 보여줄 센서

function fmtNum(n, digits=1){
  return Number(n).toLocaleString("ko-KR", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function renderTelemetry(sensors){
  const list = document.getElementById("telemetry-list");
  list.innerHTML = "";
  SENSOR_ORDER.forEach(name => {
    if (!(name in sensors)) return;
    const row = document.createElement("div");
    row.className = "telemetry-row" + (name === selectedSensor ? " selected" : "");
    row.setAttribute("role", "button");
    row.setAttribute("tabindex", "0");
    row.title = `${name} 추이를 그래프로 보기`;
    row.innerHTML = `
      <span class="name">${name}</span>
      <span class="val">${fmtNum(sensors[name])} ${SENSOR_UNITS[name] || ""}</span>
    `;
    row.addEventListener("click", () => selectSensor(name));
    row.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " "){
        e.preventDefault();
        selectSensor(name);
      }
    });
    list.appendChild(row);
  });
}

function selectSensor(name){
  if (selectedSensor === name) return;
  selectedSensor = name;

  // 목록 전체를 다시 그리지 않고 선택 표시만 교체
  document.querySelectorAll("#telemetry-list .telemetry-row").forEach(row => {
    const rowName = row.querySelector(".name") ? row.querySelector(".name").textContent : null;
    row.classList.toggle("selected", rowName === name);
  });

  redrawChart();
}

function renderDiagnosis(prediction){
  const list = document.getElementById("diag-list");
  list.innerHTML = "";

  if (!prediction){
    list.innerHTML = `<div class="empty-state">예측 결과 대기 중</div>`;
    return;
  }

  // 아직 버퍼가 안 찼거나 준비 중인 상태
  if (prediction.status && prediction.status !== "ready"){
    const windowSec = prediction.window_sec || 10;
    list.innerHTML = `<div class="empty-state">AI 예측 준비 중 (${windowSec}초 데이터 수집 단계)</div>`;
    return;
  }

  // LightGBM 판정 결과: normal / abnormal
  const result = prediction.result;
  const isAbnormal = result === "abnormal";
  const risk = isAbnormal ? "danger" : "normal";
  const label = isAbnormal ? "이상" : "정상";

  const row = document.createElement("div");
  row.className = "diag-row";
  row.innerHTML = `
    <span class="name">설비 종합 판정</span>
    <span class="state">
      <span class="badge risk-${risk}"></span>
      <span class="state-text risk-${risk}">${label}</span>
    </span>
  `;
  list.appendChild(row);

  const meta = document.createElement("div");
  meta.className = "diag-meta";
  const windowSec = prediction.window_sec != null ? `${prediction.window_sec}초 윈도우` : "";
  const updatedAt = prediction.updated_at
    ? new Date(prediction.updated_at).toLocaleTimeString("ko-KR", { hour12: false })
    : "";
  meta.textContent = [windowSec, updatedAt && `갱신 ${updatedAt}`].filter(Boolean).join(" · ");
  list.appendChild(meta);
}

function updateHeader(data){
  const pred = data.prediction || {};

  // 예측 윈도우 길이 표시 (신종건 측 파이프라인 기준 10초)
  document.getElementById("cycle-id").textContent =
    pred.window_sec != null ? `${pred.window_sec}s` : "—";

  // 페이지를 연 뒤 경과한 시간
  document.getElementById("elapsed-sec").textContent =
    Math.round((Date.now() - PAGE_START) / 1000);

  // 예측이 만들어진 시각 기준으로 얼마나 지났는지
  if (pred.updated_at){
    const updatedAt = new Date(pred.updated_at);
    const ageSec = Math.max(0, Math.round((Date.now() - updatedAt.getTime()) / 1000));
    document.getElementById("update-age").textContent = `갱신 후 ${ageSec}초`;
  } else {
    document.getElementById("update-age").textContent = "—";
  }

  const dot = document.getElementById("conn-dot");
  const text = document.getElementById("conn-text");
  const stalled = (Date.now() - lastChangeAt) > STALE_MS;

  dot.classList.remove("live","risk-danger");

  if (stalled){
    text.textContent = "데이터 지연";
    if (!unityCleared){ clearUnity(); unityCleared = true; }
  } else if (pred.result === "abnormal"){
    dot.classList.add("risk-danger");
    text.textContent = "이상 감지됨";
  } else {
    dot.classList.add("live");
    text.textContent = (pred.status && pred.status !== "ready")
      ? "정상 수신 중 (AI 준비 중)"
      : "정상 수신 중";
  }
}

/** 이번 응답에 들어있는 설비 ID 목록을 뽑는다 (설비별 이력을 모두 기록하기 위함) */
function listEquipmentIds(payload){
  if (!payload || typeof payload !== "object") return [];
  if (Array.isArray(payload)){
    return payload.map(s => s.equipment_id).filter(Boolean);
  }
  if (Array.isArray(payload.equipment_states)){
    return payload.equipment_states.map(s => s.equipment_id).filter(Boolean);
  }
  // 설비 ID를 키로 갖는 객체 (_meta 같은 부가 키는 제외)
  return Object.keys(payload).filter(k => {
    const v = payload[k];
    return v && typeof v === "object" && (v.sensors || v.prediction);
  });
}

/** 특정 설비의 데이터를 응답에서 꺼낸다 */
function getEquipmentById(payload, id){
  if (!payload || typeof payload !== "object") return null;
  if (!Array.isArray(payload) && payload[id]) return payload[id];
  const list = Array.isArray(payload) ? payload
             : (Array.isArray(payload.equipment_states) ? payload.equipment_states : null);
  if (list) return list.find(s => s.equipment_id === id) || null;
  return null;
}

/**
 * 화면에 보이지 않는 설비까지 포함해서 모든 설비의 이력을 기록한다.
 * 이렇게 해두면 Unity에서 다른 설비를 클릭했을 때 그 설비의 지난 추이가 바로 보인다.
 */
function updateAllHistories(payload){
  const ids = listEquipmentIds(payload);

  if (ids.length === 0){
    // 설비 구분이 없는 단일 데이터: 현재 선택된 설비 이력에만 기록
    const single = pickEquipmentData(payload);
    if (single) recordHistory(selectedEquipmentId, single);
    return;
  }

  ids.forEach(id => {
    const data = getEquipmentById(payload, id);
    if (data) recordHistory(id, data);
  });
}

/** 설비 하나의 이력에 이번 값을 한 점 추가한다 */
function recordHistory(equipmentId, data){
  if (!histories[equipmentId]) histories[equipmentId] = makeHistory();
  const history = histories[equipmentId];
  const pred = data.prediction || {};

  const stampSource = pred.updated_at ? new Date(pred.updated_at) : new Date();
  history.labels.push(stampSource.toLocaleTimeString("ko-KR", { hour12: false }));

  SENSOR_ORDER.forEach(name => {
    history.sensors[name].push(data.sensors && name in data.sensors ? data.sensors[name] : null);
  });

  if (history.labels.length > MAX_HISTORY){
    history.labels.shift();
    SENSOR_ORDER.forEach(name => history.sensors[name].shift());
  }
}

function updateChart(payload){
  updateAllHistories(payload);
  redrawChart();
}

function redrawChart(){
  if (!chart) return;
  const history = currentHistory();
  const unit = SENSOR_UNITS[selectedSensor] || "";

  chart.data.labels = history.labels;
  chart.data.datasets[0].label = unit ? `${selectedSensor} (${unit})` : selectedSensor;
  chart.data.datasets[0].data = history.sensors[selectedSensor] || [];
  chart.update("none");

  const titleEl = document.getElementById("chart-title");
  if (titleEl){
    titleEl.textContent = unit ? `${selectedSensor} 추이 (${unit})` : `${selectedSensor} 추이`;
  }
}

function initChart(){
  const ctx = document.getElementById("trend-chart").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [
        {
          label: selectedSensor,
          data: [],
          borderColor: "#2fe0c4",
          backgroundColor: "rgba(47,224,196,0.08)",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.3,
          fill: true,
          spanGaps: true,  // 값이 빠진 구간(null)이 있어도 선을 이어서 그림
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          labels: { color: "#7c8e9c", font: { family: "IBM Plex Mono", size: 11 }, boxWidth: 10 },
        },
      },
      scales: {
        x: { ticks: { color: "#4d5c68", font: { family: "IBM Plex Mono", size: 10 } }, grid: { color: "#1a2530" } },
        y: { ticks: { color: "#4d5c68", font: { size: 10 } }, grid: { color: "#1a2530" } },
      },
    },
  });
  redrawChart();
}

// ---------- Unity로 데이터 전달 (web-unity.md 규격) ----------
function sendToUnity(payload){
  if (!unityInstance) return;
  try {
    unityInstance.SendMessage(UNITY_OBJECT_NAME, UNITY_METHOD_NAME, JSON.stringify(payload));
  } catch (err) {
    console.error("Unity SendMessage(ApplyState) 실패:", err);
  }
}

function clearUnity(){
  if (!unityInstance) return;
  try {
    unityInstance.SendMessage(UNITY_OBJECT_NAME, UNITY_CLEAR_METHOD);
  } catch (err) {
    console.error("Unity SendMessage(ClearState) 실패:", err);
  }
}

let unityCleared = false; // 연속으로 여러 번 ClearState를 호출하지 않기 위한 플래그
let lastPayload = null;   // 설비를 바꿨을 때 즉시 다시 그리기 위해 마지막 응답을 보관
let lastStamp = null;     // 데이터가 실제로 바뀌었는지 판별하기 위한 지문

/**
 * State 파일이 어떤 형태로 오든 선택된 설비의 데이터를 꺼낸다.
 * 지원하는 형태:
 *   1) { "station-01": {...}, "station-02": {...} }   (설비 ID를 키로 갖는 객체)
 *   2) { equipment_states: [ {equipment_id, ...}, ... ] }  (배열로 감싼 형태)
 *   3) [ {equipment_id, ...}, ... ]                    (최상위가 배열)
 *   4) { sensors: {...}, prediction: {...} }           (설비 구분 없는 단일 데이터)
 */
function pickEquipmentData(payload){
  if (!payload || typeof payload !== "object") return null;

  // 1) 설비 ID를 키로 갖는 객체
  if (!Array.isArray(payload) && payload[selectedEquipmentId]){
    return payload[selectedEquipmentId];
  }

  // 2) / 3) 배열 형태
  const list = Array.isArray(payload) ? payload
             : (Array.isArray(payload.equipment_states) ? payload.equipment_states : null);
  if (list && list.length > 0){
    return list.find(s => s.equipment_id === selectedEquipmentId) || list[0];
  }

  // 1)에서 선택 설비를 못 찾았지만, 다른 설비 키는 있는 경우 -> 첫 번째 설비로 대체
  if (!Array.isArray(payload)){
    const firstStation = EQUIPMENT_IDS.find(id => payload[id]);
    if (firstStation) return payload[firstStation];
  }

  // 4) 설비 구분 없는 단일 데이터
  if (payload.sensors) return payload;

  return null;
}

/** 응답이 실제로 바뀌었는지 판별할 지문. event_id가 없는 형식이라 updated_at을 사용. */
function makeStamp(payload, view){
  const pred = view && view.prediction;
  if (pred && pred.updated_at) return String(pred.updated_at);
  if (payload && payload.updated_at) return String(payload.updated_at);
  try { return JSON.stringify(view && view.sensors); } catch (e) { return String(Date.now()); }
}

function renderSelectedEquipment(){
  const labelEl = document.getElementById("unit-label");
  if (labelEl) labelEl.textContent = selectedEquipmentId.toUpperCase();

  // 설비를 바꾸면 그 설비의 이력으로 차트를 다시 그린다
  redrawChart();

  // 마지막으로 받은 데이터가 있으면 즉시 화면 갱신 (다음 폴링까지 기다리지 않도록)
  if (lastPayload){
    const view = pickEquipmentData(lastPayload);
    if (view){
      renderTelemetry(view.sensors || {});
      renderDiagnosis(view.prediction);
      updateHeader(view);   // 설비마다 판정이 다르므로 헤더 상태도 같이 갱신
    }
  }
}

// Unity 3D 화면에서 머신을 클릭하면 이 이벤트가 날아온다
window.addEventListener("hydrotwin-equipment-selected", (event) => {
  const id = event.detail && event.detail.equipmentId;
  if (!id || id === selectedEquipmentId) return;
  selectedEquipmentId = id;
  console.log("선택된 설비:", selectedEquipmentId);
  renderSelectedEquipment();
});

async function poll(){
  try {
    const res = await fetch(`${API_BASE}/api/v1/state/latest`);
    if (!res.ok) {
      if (res.status === 503){
        document.getElementById("conn-text").textContent = "State 데이터 대기 중";
        document.getElementById("conn-dot").classList.remove("live");
        if (!unityCleared){ clearUnity(); unityCleared = true; }
      }
      return;
    }
    const payload = await res.json();
    lastPayload = payload;

    const data = pickEquipmentData(payload);
    if (!data){
      document.getElementById("conn-text").textContent = "설비 데이터 없음";
      document.getElementById("conn-dot").classList.remove("live");
      return;
    }

    // updated_at이 바뀐 경우에만 "새 데이터"로 취급 (수신 횟수, 차트 점 추가)
    const stamp = makeStamp(payload, data);
    if (stamp !== lastStamp){
      lastStamp = stamp;
      lastChangeAt = Date.now();
      receivedCount += 1;
      document.getElementById("poll-count").textContent = receivedCount;
      updateChart(payload);

      // Unity에는 원본 응답을 그대로 전달 (설비 3대를 Unity가 각각 처리하도록)
      sendToUnity(payload);
      unityCleared = false;
    }

    renderTelemetry(data.sensors || {});
    renderDiagnosis(data.prediction);
    updateHeader(data);
  } catch (err) {
    document.getElementById("conn-text").textContent = "API 연결 실패";
    document.getElementById("conn-dot").classList.remove("live");
    if (!unityCleared){ clearUnity(); unityCleared = true; }
    console.error("poll error:", err);
  }
}

function loadUnity(){
  const statusEl = document.getElementById("unity-status");
  const canvas = document.getElementById("unity-canvas");
  const buildFolder = UNITY_BUILD_FOLDER;
  const loaderUrl = `${buildFolder}/pro-build.loader.js`;

  const config = {
    dataUrl: `${buildFolder}/pro-build.data.gz`,
    frameworkUrl: `${buildFolder}/pro-build.framework.js.gz`,
    codeUrl: `${buildFolder}/pro-build.wasm.gz`,
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",   // 실제 Unity Player Settings 값과 달라도 로딩엔 문제 없음
    productName: "HydraulicDigitalTwin",
    productVersion: "1.0",
  };

  const script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = () => {
    if (typeof createUnityInstance !== "function"){
      statusEl.textContent = "Unity 로더 스크립트는 불러왔지만 createUnityInstance를 찾을 수 없음";
      statusEl.classList.add("error");
      return;
    }
    createUnityInstance(canvas, config, (progress) => {
      statusEl.textContent = `Unity 로딩 중... ${Math.round(progress * 100)}%`;
    }).then((instance) => {
      unityInstance = instance;
      statusEl.classList.add("hidden");
    }).catch((err) => {
      statusEl.textContent = "Unity 인스턴스 생성 실패";
      statusEl.classList.add("error");
      console.error("createUnityInstance 실패:", err);
    });
  };
  script.onerror = () => {
    statusEl.textContent = `Unity 빌드 파일을 못 찾음 (${loaderUrl}). web/${UNITY_BUILD_FOLDER}/ 폴더에 빌드 파일이 있는지 확인하세요.`;
    statusEl.classList.add("error");
  };
  document.body.appendChild(script);
}

// ---------- 크기 조절 (사이드바 너비) ----------
// 최소값을 기본값과 같게 둬서 "넓히기"만 가능하게 한다.
// (좁히면 센서 이름/값이 붙어버려서 읽기 어려워지므로)
const SIDE_DEFAULT = 340;
const SIDE_MIN = SIDE_DEFAULT, SIDE_MAX = 720;

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

function setSideWidth(px){
  const w = clamp(px, SIDE_MIN, SIDE_MAX);
  document.documentElement.style.setProperty("--side-width", `${w}px`);
  // 사이드바를 넓혀도 센서 목록이 과하게 길어지지 않도록 완만하게만 늘린다
  // (너무 길어지면 아래 AI 진단 영역이 밀려서 잘릴 수 있음)
  document.documentElement.style.setProperty(
    "--telemetry-height", `${clamp(280 + (w - SIDE_DEFAULT) * 0.25, 240, 400)}px`
  );
  return w;
}

/**
 * 사이드바 너비 조절 손잡이를 동작하게 만든다.
 * 왼쪽으로 끌수록 사이드바가 넓어진다.
 */
function initResizers(){
  const handle = document.getElementById("col-resizer");
  const sidePanel = document.querySelector(".side-panel");
  if (!handle) return;

  const getSize = () => sidePanel ? sidePanel.getBoundingClientRect().width : SIDE_DEFAULT;

  let startX = 0, startSize = 0, dragging = false;

  const onMove = (e) => {
    if (!dragging) return;
    const point = e.touches ? e.touches[0] : e;
    setSideWidth(startSize + (startX - point.clientX));
  };

  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove("dragging");
    document.body.classList.remove("resizing", "resizing-col");
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
    window.removeEventListener("touchmove", onMove);
    window.removeEventListener("touchend", onUp);
  };

  const onDown = (e) => {
    const point = e.touches ? e.touches[0] : e;
    dragging = true;
    startX = point.clientX;
    startSize = getSize();
    handle.classList.add("dragging");
    document.body.classList.add("resizing", "resizing-col");
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onUp);
    e.preventDefault();
  };

  handle.addEventListener("mousedown", onDown);
  handle.addEventListener("touchstart", onDown, { passive: false });

  // 더블클릭하면 기본 너비로 되돌리기
  handle.addEventListener("dblclick", () => setSideWidth(SIDE_DEFAULT));
}

initChart();
initResizers();
document.getElementById("unit-label").textContent = selectedEquipmentId.toUpperCase();
loadUnity();
poll();
setInterval(poll, POLL_INTERVAL_MS);
</script>
