<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유압 시스템 모니터링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="chart.umd.js"></script>
<style>
  :root{
    --bg-base:#0a0f14;
    --bg-panel:#0f161d;
    --bg-panel-2:#131b23;
    --border:#22303b;
    --border-soft:#1a2530;
    --text-primary:#e6edf3;
    --text-secondary:#7c8e9c;
    --text-dim:#4d5c68;
    --accent:#2fe0c4;
    --accent-dim:rgba(47,224,196,0.12);
    --normal:#34d399;
    --caution:#fbbf24;
    --warning:#fb923c;
    --danger:#f87171;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans KR', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:var(--bg-base);
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
    line-height:1.5;
    scrollbar-width:none;       /* Firefox */
    -ms-overflow-style:none;    /* 구형 Edge/IE */
  }
  body::-webkit-scrollbar{ display:none; }  /* Chrome/Safari/Edge */

  /* ---------- 헤더 ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 28px;
    border-bottom:1px solid var(--border-soft);
  }
  .title-block{ display:flex; align-items:baseline; gap:14px; }
  .title-block h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:20px;
    letter-spacing:-0.01em;
  }
  .title-block span{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
  }
  .status-cluster{ display:flex; align-items:center; gap:20px; }
  .status-item{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-secondary);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--text-dim);
    transition:background .3s;
  }
  .dot.live{
    background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim);
  }
  .dot.risk-danger{ background:var(--danger); box-shadow:0 0 0 3px rgba(248,113,113,0.15); }

  /* ---------- 레이아웃 ---------- */
  main{
    display:grid;
    grid-template-columns:1fr 340px;
    gap:1px;
    background:var(--border-soft);
  }
  @media (max-width:900px){
    main{ grid-template-columns:1fr; }
  }

  .panel{ background:var(--bg-base); padding:24px; }
  .panel-title{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.04em;
    margin-bottom:16px;
  }

  /* ---------- 회로 다이어그램 ---------- */
  .diagram-wrap{ min-height:420px; display:flex; align-items:center; justify-content:center; }
  #circuit-svg{ width:100%; max-width:640px; }
  .node-box{ fill:var(--bg-panel-2); stroke:var(--border); stroke-width:1.5; transition:stroke .4s, filter .4s; }
  .node-box.risk-normal{ stroke:var(--normal); filter:drop-shadow(0 0 6px rgba(52,211,153,0.25)); }
  .node-box.risk-caution{ stroke:var(--caution); filter:drop-shadow(0 0 6px rgba(251,191,36,0.25)); }
  .node-box.risk-warning{ stroke:var(--warning); filter:drop-shadow(0 0 6px rgba(251,146,60,0.3)); }
  .node-box.risk-danger{ stroke:var(--danger); filter:drop-shadow(0 0 8px rgba(248,113,113,0.35)); }
  .node-label{ font-family:var(--font-display); font-size:13px; font-weight:600; fill:var(--text-primary); }
  .node-sub{ font-family:var(--font-mono); font-size:10px; fill:var(--text-secondary); }
  .pipe{ stroke:var(--border); stroke-width:2; fill:none; }
  .pipe-flow{ stroke:var(--accent); stroke-width:2; fill:none; opacity:0.5; stroke-dasharray:4 6; }

  /* ---------- 요약 카드 ---------- */
  .summary-row{ display:flex; gap:24px; margin-top:20px; }
  .summary-card{
    font-family:var(--font-mono);
  }
  .summary-card .value{ font-size:20px; color:var(--text-primary); }
  .summary-card .label{ font-size:11px; color:var(--text-dim); margin-top:2px; }

  /* ---------- 사이드바: 텔레메트리 ---------- */
  .side-panel{ background:var(--bg-base); border-left:1px solid var(--border-soft); }
  .section{ padding:22px 24px; border-bottom:1px solid var(--border-soft); }
  .section-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:14px;
  }
  .section-header h2{
    font-family:var(--font-display);
    font-size:14px; font-weight:600;
  }
  .section-header .count{
    font-family:var(--font-mono);
    font-size:11px; color:var(--accent);
  }

  .telemetry-list{
    display:flex; flex-direction:column; gap:9px; max-height:280px; overflow-y:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .telemetry-list::-webkit-scrollbar{ display:none; }
  .telemetry-row{
    display:flex; justify-content:space-between;
    font-size:12.5px;
  }
  .telemetry-row .name{ color:var(--text-secondary); }
  .telemetry-row .val{ font-family:var(--font-mono); color:var(--text-primary); }

  .diag-list{ display:flex; flex-direction:column; gap:10px; }
  .diag-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 10px;
    background:var(--bg-panel);
    border-radius:6px;
    border:1px solid var(--border-soft);
  }
  .diag-row .name{ font-size:12.5px; color:var(--text-secondary); }
  .diag-row .state{ display:flex; align-items:center; gap:7px; }
  .diag-row .state-text{ font-family:var(--font-mono); font-size:11.5px; }
  .badge{
    width:7px; height:7px; border-radius:50%;
  }
  .badge.risk-normal{ background:var(--normal); }
  .badge.risk-caution{ background:var(--caution); }
  .badge.risk-warning{ background:var(--warning); }
  .badge.risk-danger{ background:var(--danger); }
  .state-text.risk-normal{ color:var(--normal); }
  .state-text.risk-caution{ color:var(--caution); }
  .state-text.risk-warning{ color:var(--warning); }
  .state-text.risk-danger{ color:var(--danger); }

  .conf-bar-track{ width:100%; height:2px; background:var(--border-soft); border-radius:2px; margin-top:6px; }
  .conf-bar-fill{ height:100%; border-radius:2px; background:var(--text-dim); transition:width .4s; }

  /* ---------- 하단 추이 차트 ---------- */
  .trend-panel{
    grid-column:1 / -1;
    background:var(--bg-base);
    padding:24px 28px 28px;
    border-top:1px solid var(--border-soft);
  }
  .chart-wrap{ height:220px; }

  .empty-state{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    text-align:center;
    padding:40px 0;
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>유압 시스템 모니터링</h1>
    <span id="unit-label">HYDRAULIC UNIT 01</span>
  </div>
  <div class="status-cluster">
    <div class="status-item"><span>사이클 #<span id="cycle-id">—</span></span></div>
    <div class="status-item"><span id="update-age">데이터 대기 중</span></div>
    <div class="status-item">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">연결 확인 중</span>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-title">시스템 회로도</div>
    <div class="diagram-wrap">
      <svg id="circuit-svg" viewBox="0 0 640 380">
        <path class="pipe" d="M 120 90 H 520" />
        <path class="pipe" d="M 520 90 V 290" />
        <path class="pipe" d="M 520 290 H 120" />
        <path class="pipe" d="M 120 290 V 90" />
        <path class="pipe-flow" d="M 120 90 H 520" />
        <path class="pipe-flow" d="M 520 90 V 290" />
        <path class="pipe-flow" d="M 520 290 H 120" />
        <path class="pipe-flow" d="M 120 290 V 90" />

        <g id="node-pump" transform="translate(60,60)">
          <rect class="node-box" width="120" height="60" rx="8"/>
          <text class="node-label" x="60" y="26" text-anchor="middle">펌프</text>
          <text class="node-sub" id="pump-sub" x="60" y="44" text-anchor="middle">—</text>
        </g>
        <g id="node-valve" transform="translate(460,60)">
          <rect class="node-box" width="120" height="60" rx="8"/>
          <text class="node-label" x="60" y="26" text-anchor="middle">밸브</text>
          <text class="node-sub" id="valve-sub" x="60" y="44" text-anchor="middle">—</text>
        </g>
        <g id="node-cooler" transform="translate(460,260)">
          <rect class="node-box" width="120" height="60" rx="8"/>
          <text class="node-label" x="60" y="26" text-anchor="middle">쿨러</text>
          <text class="node-sub" id="cooler-sub" x="60" y="44" text-anchor="middle">—</text>
        </g>
        <g id="node-accumulator" transform="translate(60,260)">
          <rect class="node-box" width="120" height="60" rx="8"/>
          <text class="node-label" x="60" y="26" text-anchor="middle">어큐뮬레이터</text>
          <text class="node-sub" id="accumulator-sub" x="60" y="44" text-anchor="middle">—</text>
        </g>
      </svg>
    </div>
    <div class="summary-row">
      <div class="summary-card">
        <div class="value" id="elapsed-sec">—</div>
        <div class="label">경과 시간 (sec)</div>
      </div>
      <div class="summary-card">
        <div class="value" id="poll-count">0</div>
        <div class="label">수신 횟수</div>
      </div>
    </div>
  </section>

  <aside class="side-panel">
    <div class="section">
      <div class="section-header">
        <h2>센서 텔레메트리</h2>
        <span class="count" id="sensor-count">17 채널</span>
      </div>
      <div class="telemetry-list" id="telemetry-list">
        <div class="empty-state">데이터 수신 대기 중</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>AI 진단</h2>
      </div>
      <div class="diag-list" id="diag-list">
        <div class="empty-state">예측 결과 대기 중</div>
      </div>
    </div>
  </aside>

  <section class="trend-panel">
    <div class="panel-title">냉각 효율 · 펌프 압력 추이</div>
    <div class="chart-wrap">
      <canvas id="trend-chart"></canvas>
    </div>
  </section>
</main>

<script>
const API_BASE = "http://127.0.0.1:8000";
const POLL_INTERVAL_MS = 3000;
const MAX_HISTORY = 30;

const SENSOR_ORDER = ["PS1","PS2","PS3","PS4","PS5","PS6","EPS1","FS1","FS2","TS1","TS2","TS3","TS4","VS1","CE","CP","SE"];
const SENSOR_UNITS = {
  PS1:"bar", PS2:"bar", PS3:"bar", PS4:"bar", PS5:"bar", PS6:"bar",
  EPS1:"W", FS1:"l/min", FS2:"l/min",
  TS1:"°C", TS2:"°C", TS3:"°C", TS4:"°C",
  VS1:"mm/s", CE:"%", CP:"kW", SE:"%",
};

const RISK_LABEL = { normal:"정상", caution:"주의", warning:"경고", danger:"위험" };
const COMPONENT_LABEL = { pump:"펌프", valve:"밸브", cooler:"쿨러", accumulator:"어큐뮬레이터" };

let pollCount = 0;
let chart = null;
const history = { labels: [], ce: [], ps2: [] };

function fmtNum(n, digits=1){
  return Number(n).toLocaleString("ko-KR", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function renderTelemetry(sensors){
  const list = document.getElementById("telemetry-list");
  list.innerHTML = "";
  SENSOR_ORDER.forEach(name => {
    if (!(name in sensors)) return;
    const row = document.createElement("div");
    row.className = "telemetry-row";
    row.innerHTML = `
      <span class="name">${name}</span>
      <span class="val">${fmtNum(sensors[name])} ${SENSOR_UNITS[name] || ""}</span>
    `;
    list.appendChild(row);
  });
}

function renderDiagnosis(components){
  const list = document.getElementById("diag-list");
  list.innerHTML = "";
  Object.entries(components).forEach(([key, c]) => {
    const row = document.createElement("div");
    row.className = "diag-row";
    row.innerHTML = `
      <span class="name">${COMPONENT_LABEL[key] || key}</span>
      <span class="state">
        <span class="badge risk-${c.risk_level}"></span>
        <span class="state-text risk-${c.risk_level}">${RISK_LABEL[c.risk_level] || c.risk_level}</span>
      </span>
    `;
    list.appendChild(row);

    // 다이어그램 노드 색상/서브텍스트 갱신
    const nodeBox = document.querySelector(`#node-${key} .node-box`);
    const nodeSub = document.getElementById(`${key}-sub`);
    if (nodeBox){
      nodeBox.classList.remove("risk-normal","risk-caution","risk-warning","risk-danger");
      nodeBox.classList.add(`risk-${c.risk_level}`);
    }
    if (nodeSub){
      nodeSub.textContent = `${(c.confidence*100).toFixed(0)}% 확신`;
    }
  });
}

function updateHeader(data){
  document.getElementById("cycle-id").textContent = data.cycle_id;
  document.getElementById("elapsed-sec").textContent = data.elapsed_sec;

  const updatedAt = new Date(data.updated_at);
  const ageSec = Math.max(0, Math.round((Date.now() - updatedAt.getTime()) / 1000));
  document.getElementById("update-age").textContent = `${ageSec}초 전 갱신`;

  const dot = document.getElementById("conn-dot");
  const text = document.getElementById("conn-text");
  const anyDanger = Object.values(data.prediction.components).some(c => c.risk_level === "danger");

  dot.classList.remove("live","risk-danger");
  if (anyDanger){
    dot.classList.add("risk-danger");
    text.textContent = "위험 감지됨";
  } else {
    dot.classList.add("live");
    text.textContent = "정상 수신 중";
  }
}

function updateChart(data){
  const label = `#${data.cycle_id}`;
  history.labels.push(label);
  history.ce.push(data.sensors.CE);
  history.ps2.push(data.sensors.PS2);

  if (history.labels.length > MAX_HISTORY){
    history.labels.shift();
    history.ce.shift();
    history.ps2.shift();
  }

  chart.data.labels = history.labels;
  chart.data.datasets[0].data = history.ce;
  chart.data.datasets[1].data = history.ps2;
  chart.update("none");
}

function initChart(){
  const ctx = document.getElementById("trend-chart").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [
        {
          label: "냉각 효율 CE (%)",
          data: [],
          borderColor: "#2fe0c4",
          backgroundColor: "rgba(47,224,196,0.08)",
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.3,
          yAxisID: "y",
          fill: true,
        },
        {
          label: "펌프 압력 PS2 (bar)",
          data: [],
          borderColor: "#7c8e9c",
          borderWidth: 1.5,
          pointRadius: 0,
          borderDash: [3,3],
          tension: 0.3,
          yAxisID: "y1",
          fill: false,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          labels: { color: "#7c8e9c", font: { family: "IBM Plex Mono", size: 11 }, boxWidth: 10 },
        },
      },
      scales: {
        x: { ticks: { color: "#4d5c68", font: { family: "IBM Plex Mono", size: 10 } }, grid: { color: "#1a2530" } },
        y: { position: "left", ticks: { color: "#4d5c68", font: { size: 10 } }, grid: { color: "#1a2530" } },
        y1: { position: "right", ticks: { color: "#4d5c68", font: { size: 10 } }, grid: { display: false } },
      },
    },
  });
}

async function poll(){
  try {
    const res = await fetch(`${API_BASE}/data`);
    if (!res.ok) {
      if (res.status === 503){
        document.getElementById("conn-text").textContent = "Kafka Consumer 대기 중";
        document.getElementById("conn-dot").classList.remove("live");
      }
      return;
    }
    const data = await res.json();
    pollCount += 1;
    document.getElementById("poll-count").textContent = pollCount;

    renderTelemetry(data.sensors);
    renderDiagnosis(data.prediction.components);
    updateHeader(data);
    updateChart(data);
  } catch (err) {
    document.getElementById("conn-text").textContent = "API 연결 실패";
    document.getElementById("conn-dot").classList.remove("live");
    console.error("poll error:", err);
  }
}

initChart();
poll();
setInterval(poll, POLL_INTERVAL_MS);
</script>

</body>
</html>
