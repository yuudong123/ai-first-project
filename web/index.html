<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유압 시스템 모니터링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="chart.umd.js"></script>
<script src="sensor-bands.js?v=20260903-1"></script>
<style>
  :root{
    --bg-base:#0a0f14;
    --bg-panel:#0f161d;
    --bg-panel-2:#131b23;
    --border:#22303b;
    --border-soft:#1a2530;
    --text-primary:#e6edf3;
    --text-secondary:#7c8e9c;
    --text-dim:#4d5c68;
    --accent:#2fe0c4;
    --accent-dim:rgba(47,224,196,0.12);
    --normal:#34d399;
    --caution:#fbbf24;
    --warning:#fb923c;
    --danger:#f87171;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'IBM Plex Sans KR', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:var(--bg-base);
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
    line-height:1.5;
    scrollbar-width:none;       /* Firefox */
    -ms-overflow-style:none;    /* 구형 Edge/IE */
  }
  body::-webkit-scrollbar{ display:none; }  /* Chrome/Safari/Edge */

  /* ---------- 헤더 ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:20px 28px;
    border-bottom:1px solid var(--border-soft);
  }
  .title-block{ display:flex; align-items:baseline; gap:14px; }
  .title-block h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:20px;
    letter-spacing:-0.01em;
  }
  .title-block span{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
  }

  /* ---------- 헤더 가운데 지표 ---------- */
  .header-metrics{
    display:flex;
    gap:32px;
    align-items:baseline;
  }
  .metric{ display:flex; align-items:baseline; gap:8px; }
  .metric-value{
    font-family:var(--font-mono);
    font-size:20px;
    color:var(--text-primary);
    line-height:1;
  }
  .metric-label{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
  }
  @media (max-width:1100px){
    .header-metrics{ display:none; }  /* 좁은 화면에선 헤더가 복잡해지니 숨김 */
  }
  .status-cluster{ display:flex; align-items:center; gap:20px; }
  .status-item{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-secondary);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--text-dim);
    transition:background .3s;
  }
  .dot.live{
    background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim);
  }
  .dot.risk-danger{ background:var(--danger); box-shadow:0 0 0 3px rgba(248,113,113,0.15); }

  /* ---------- 레이아웃 ---------- */
  main{
    display:grid;
    grid-template-columns:1fr 340px;
    gap:1px;
    background:var(--border-soft);
  }
  @media (max-width:900px){
    main{ grid-template-columns:1fr; }
  }

  .panel{ background:var(--bg-base); padding:24px; }
  .panel-title{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.04em;
    margin-bottom:16px;
  }

  /* ---------- 사이드바: 텔레메트리 ---------- */
  .side-panel{ background:var(--bg-base); border-left:1px solid var(--border-soft); }
  .section{ padding:22px 24px; border-bottom:1px solid var(--border-soft); }
  .section-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:14px;
  }
  .section-header h2{
    font-family:var(--font-display);
    font-size:14px; font-weight:600;
  }
  .section-header .count{
    font-family:var(--font-mono);
    font-size:11px; color:var(--accent);
  }

  .telemetry-list{
    display:flex; flex-direction:column; gap:4px;
    max-height:280px;
    overflow-y:auto;
    /* 스크롤바가 값 텍스트를 가리지 않도록 오른쪽에 여백 확보 */
    padding-right:10px;
    scrollbar-width:thin;                        /* Firefox */
    scrollbar-color:var(--border) transparent;   /* Firefox: 막대 / 트랙 */
  }
  /* Chrome/Safari/Edge 스크롤바 */
  .telemetry-list::-webkit-scrollbar{ width:6px; }
  .telemetry-list::-webkit-scrollbar-track{ background:transparent; }
  .telemetry-list::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:3px;
  }
  .telemetry-list::-webkit-scrollbar-thumb:hover{ background:var(--text-dim); }

  /* 센서 행: 클릭하면 해당 센서 그래프로 전환 */
  .telemetry-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px;
    padding:5px 8px;
    border-radius:5px;
    cursor:pointer;
    border-left:2px solid transparent;
    transition:background .15s, border-color .15s;
  }
  .telemetry-row:hover{ background:var(--bg-panel); }
  .telemetry-row:focus-visible{
    outline:none;
    background:var(--bg-panel);
    border-left-color:var(--text-dim);
  }
  .telemetry-row.selected{
    background:var(--accent-dim);
    border-left-color:var(--accent);
  }
  .telemetry-row.selected .name{ color:var(--accent); }
  .telemetry-row .name{ color:var(--text-secondary); transition:color .15s; }
  .telemetry-row .val{ font-family:var(--font-mono); color:var(--text-primary); }

  .diag-list{ display:flex; flex-direction:column; gap:10px; }
  .diag-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 10px;
    background:var(--bg-panel);
    border-radius:6px;
    border:1px solid var(--border-soft);
  }
  .diag-row .name{ font-size:12.5px; color:var(--text-secondary); }
  .diag-row .state{ display:flex; align-items:center; gap:7px; }
  .diag-row .state-text{ font-family:var(--font-mono); font-size:11.5px; }
  .badge{
    width:7px; height:7px; border-radius:50%;
  }
  .badge.risk-normal{ background:var(--normal); }
  .badge.risk-caution{ background:var(--caution); }
  .badge.risk-warning{ background:var(--warning); }
  .badge.risk-danger{ background:var(--danger); }
  .state-text.risk-normal{ color:var(--normal); }
  .state-text.risk-caution{ color:var(--caution); }
  .state-text.risk-warning{ color:var(--warning); }
  .state-text.risk-danger{ color:var(--danger); }

  .conf-bar-track{ width:100%; height:2px; background:var(--border-soft); border-radius:2px; margin-top:6px; }
  .conf-bar-fill{ height:100%; border-radius:2px; background:var(--text-dim); transition:width .4s; }

  /* ---------- 하단 추이 차트 ---------- */
  .trend-panel{
    grid-column:1 / -1;
    background:var(--bg-base);
    padding:24px 28px 28px;
    border-top:1px solid var(--border-soft);
  }
  .chart-wrap{ height:220px; }
  .band-info{ font-size:12px; color:var(--text-secondary); margin:8px 0; line-height:1.6; }
  .band-info.warning, .telemetry-row.band-warning .val{ color:#ffab55; }
  .band-note{ font-size:11px; color:var(--text-dim); line-height:1.6; margin-top:8px; }

  .empty-state{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    text-align:center;
    padding:40px 0;
  }

  /* ---------- Unity WebGL 패널 ---------- */
  .unity-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:8px;
    border:1px solid var(--border-soft);
    overflow:hidden;
  }
  #unity-canvas{
    width:100%; height:100%; display:block;
  }
  .unity-status{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-dim);
    background:rgba(10,15,20,0.85);
    pointer-events:none;
    transition:opacity .3s;
  }
  .unity-status.hidden{ opacity:0; }
  .unity-status.error{ color:var(--warning); }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>유압 시스템 모니터링</h1>
    <span id="unit-label">HYDRAULIC UNIT 01</span>
  </div>

  <div class="header-metrics">
    <div class="metric">
      <span class="metric-value" id="elapsed-sec">—</span>
      <span class="metric-label">경과 시간 (sec)</span>
    </div>
    <div class="metric">
      <span class="metric-value" id="poll-count">0</span>
      <span class="metric-label">수신 횟수</span>
    </div>
  </div>

  <div class="status-cluster">
    <div class="status-item"><span>사이클 #<span id="cycle-id">—</span></span></div>
    <div class="status-item"><span id="update-age">데이터 대기 중</span></div>
    <div class="status-item">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">연결 확인 중</span>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="panel-title">3D 디지털 트윈 (Unity)</div>
    <div class="unity-wrap">
      <canvas id="unity-canvas" width="960" height="540"></canvas>
      <div id="unity-status" class="unity-status">Unity 로딩 중...</div>
    </div>
  </section>

  <aside class="side-panel">
    <div class="section">
      <div class="section-header">
        <h2>실시간 센서 현황</h2>
        <span class="count" id="sensor-count">17 채널</span>
      </div>
      <div class="telemetry-list" id="telemetry-list">
        <div class="empty-state">데이터 수신 대기 중</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>AI 진단</h2>
      </div>
      <div class="diag-list" id="diag-list">
        <div class="empty-state">예측 결과 대기 중</div>
      </div>
    </div>
  </aside>

  <section class="trend-panel">
    <div class="panel-title" id="chart-title">CE 추이 (%)</div>
    <div class="band-info" id="band-info" role="status">정상 운전 기준 범위 불러오는 중</div>
    <div class="chart-wrap">
      <canvas id="trend-chart"></canvas>
    </div>
    <div class="band-note" id="band-note">음영: 정상 운전 기준 범위 · 주황색: 범위 이탈 · AI 고장 판단과 별도</div>
  </section>
</main>

<script>
const API_BASE = location.port === '8000' ? '' : 'http://127.0.0.1:8000';
const POLL_INTERVAL_MS = 1000;
const MAX_HISTORY = 30;
const STALE_MS = 4000; // event_id가 이만큼(ms) 안 바뀌면 "데이터 지연"으로 간주

// ---------- Unity WebGL 연동 설정 ----------
// Build 폴더를 web/index.html과 같은 위치(web/Build/)에 복사해서 넣어야 함.
// 실제 파일명: pro-build.loader.js, pro-build.data.gz, pro-build.framework.js.gz, pro-build.wasm.gz
const UNITY_BUILD_FOLDER = "Build";
const UNITY_OBJECT_NAME = "_App";
// 같은 오브젝트의 내부 상태 처리 함수와 충돌하지 않는 웹 전용 진입점.
const UNITY_METHOD_NAME = "ApplyWebState";
const UNITY_CLEAR_METHOD = "ClearState";
let unityInstance = null;

const SENSOR_ORDER = ["PS1","PS2","PS3","PS4","PS5","PS6","EPS1","FS1","FS2","TS1","TS2","TS3","TS4","VS1","CE","CP","SE"];
const SENSOR_UNITS = {
  PS1:"bar", PS2:"bar", PS3:"bar", PS4:"bar", PS5:"bar", PS6:"bar",
  EPS1:"W", FS1:"l/min", FS2:"l/min",
  TS1:"°C", TS2:"°C", TS3:"°C", TS4:"°C",
  VS1:"mm/s", CE:"%", CP:"kW", SE:"%",
};

const RISK_LABEL = { normal:"정상", caution:"주의", warning:"경고", danger:"위험" };
const COMPONENT_LABEL = { pump:"펌프", valve:"밸브", cooler:"쿨러", accumulator:"어큐뮬레이터" };

// ---------- 설비 선택 (Unity 3D 화면에서 머신 클릭 시 연동) ----------
const EQUIPMENT_IDS = ["station-01", "station-02", "station-03"];
let selectedEquipmentId = "station-01";

let receivedCount = 0;   // event_id가 실제로 바뀐 횟수 (중복 카운트 안 함)
let chart = null;
let referenceBands = null;
let bandLoadFailed = false;
let lastEventId = null;
let lastChangeAt = Date.now();

// 설비별 × 센서별로 이력을 따로 쌓아둔다.
// 설비나 센서를 바꿔도 그동안 쌓인 이력이 그대로 보이도록 하기 위함.
const histories = {};
function makeHistory(){
  const h = { labels: [], sensors: {}, bandState:null };
  SENSOR_ORDER.forEach(name => { h.sensors[name] = []; });
  return h;
}
EQUIPMENT_IDS.forEach(id => { histories[id] = makeHistory(); });

function currentHistory(){
  if (!histories[selectedEquipmentId]) histories[selectedEquipmentId] = makeHistory();
  return histories[selectedEquipmentId];
}

let selectedSensor = "CE";  // 기본으로 보여줄 센서

function fmtNum(n, digits=1){
  return Number(n).toLocaleString("ko-KR", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function renderTelemetry(sensors){
  const list = document.getElementById("telemetry-list");
  list.innerHTML = "";
  SENSOR_ORDER.forEach(name => {
    if (!(name in sensors)) return;
    const row = document.createElement("div");
    row.className = "telemetry-row" + (name === selectedSensor ? " selected" : "");
    const bandState = currentHistory().bandState;
    const warning = bandState && Date.now()-bandState.stamp < STALE_MS
      && bandState.counts[name] >= (referenceBands?.warning_consecutive_samples || 3);
    row.classList.toggle('band-warning',Boolean(warning));
    row.setAttribute("role", "button");
    row.setAttribute("tabindex", "0");
    row.title = `${name} 추이를 그래프로 보기`;
    if (warning) row.title += ' · 기준 범위 이탈 경고 (AI 고장 판단과 별도)';
    row.innerHTML = `
      <span class="name">${name}</span>
      <span class="val">${warning ? '⚠ ' : ''}${fmtNum(sensors[name])} ${SENSOR_UNITS[name] || ""}</span>
    `;
    row.addEventListener("click", () => selectSensor(name));
    row.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " "){
        e.preventDefault();
        selectSensor(name);
      }
    });
    list.appendChild(row);
  });
}

function selectSensor(name){
  if (selectedSensor === name) return;
  selectedSensor = name;

  // 목록 전체를 다시 그리지 않고 선택 표시만 교체
  document.querySelectorAll("#telemetry-list .telemetry-row").forEach(row => {
    const rowName = row.querySelector(".name") ? row.querySelector(".name").textContent : null;
    row.classList.toggle("selected", rowName === name);
  });

  redrawChart();
}

function renderDiagnosis(prediction){
  const list = document.getElementById("diag-list");
  list.innerHTML = "";

  if (!prediction || prediction.status === "warming_up" || !prediction.components || Object.keys(prediction.components).length === 0){
    list.innerHTML = `<div class="empty-state">AI 예측 준비 중 (${prediction?.observed_window_sec || 0}/10초)</div>`;
    return;
  }

  Object.entries(prediction.components).forEach(([key, c]) => {
    const row = document.createElement("div");
    row.className = "diag-row";
    row.innerHTML = `
      <span class="name">${COMPONENT_LABEL[key] || key}</span>
      <span class="state">
        <span class="badge risk-${c.risk_level}"></span>
        <span class="state-text risk-${c.risk_level}">${RISK_LABEL[c.risk_level] || c.risk_level}</span>
      </span>
    `;
    list.appendChild(row);
    const explanation = document.createElement('div');
    explanation.style.cssText = 'font-size:11px;color:#7c8e9c;margin:0 0 12px';
    explanation.textContent = `분류 ${c.state ?? '—'} · 모델 예측 확률 ${((c.confidence||0)*100).toFixed(1)}% · 영향 센서: ${(c.top_sensors||[]).map(s=>s.sensor).join(', ')}`;
    list.appendChild(explanation);
  });
  const stability = document.createElement('small');
  stability.textContent = `설비 안정화: ${prediction.is_stable ? '안정' : '불안정'}`;
  list.appendChild(stability);
}


function updateHeader(data){
  document.getElementById("cycle-id").textContent = data.event_id;
  document.getElementById("elapsed-sec").textContent = data.elapsed_sec;

  // "생성 시각"(V5가 데이터를 만든 시점) 기준으로 경과 시간 표시.
  // received_at은 우리 Consumer가 받은 시각이라 둘이 다를 수 있음(네트워크 지연).
  if (data.generated_at){
    const generatedAt = new Date(data.generated_at);
    const ageSec = Math.max(0, Math.round((Date.now() - generatedAt.getTime()) / 1000));
    document.getElementById("update-age").textContent = `생성 후 ${ageSec}초`;
  } else {
    document.getElementById("update-age").textContent = "—";
  }

  const dot = document.getElementById("conn-dot");
  const text = document.getElementById("conn-text");
  const sourceTime = Date.parse(data.generated_at || data.updated_at || '');
  const stalled = (Date.now() - lastChangeAt) > STALE_MS || !Number.isFinite(sourceTime) || (Date.now() - sourceTime) > STALE_MS;

  dot.classList.remove("live","risk-danger");

  if (stalled){
    text.textContent = "데이터 지연";
    if (!unityCleared){ clearUnity(); unityCleared = true; }
  } else {
    const anyDanger = data.prediction && data.prediction.components
      ? Object.values(data.prediction.components).some(c => c.risk_level === "danger")
      : false;
    if (anyDanger){
      dot.classList.add("risk-danger");
      text.textContent = "위험 감지됨";
    } else {
      dot.classList.add("live");
      text.textContent = data.prediction && data.prediction.status === "warming_up"
        ? "정상 수신 중 (AI 대기)"
        : "정상 수신 중";
    }
  }
}

function updateChart(data){
  const history = currentHistory();
  const previous = history.bandState;
  // 생성 초기값이 달라진 구간을 하나의 연속 그래프로 연결하지 않는다.
  if (previous && (previous.run !== data.run_id || previous.segment !== data.segment_id)){
    history.labels = [];
    SENSOR_ORDER.forEach(name => history.sensors[name] = []);
  } else if (previous && (data.event_id !== previous.event+1 || Date.parse(data.generated_at || data.updated_at)-previous.stamp > 2000)){
    history.labels.push('수신 공백');
    SENSOR_ORDER.forEach(name => history.sensors[name].push(null));
  }
  history.bandState = SensorBands.advance(previous,data,referenceBands,SENSOR_ORDER);
  history.labels.push(`#${data.event_id}`);
  SENSOR_ORDER.forEach(name => {
    // 해당 사이클에 값이 없으면 null로 채워서 라벨과 길이를 맞춘다
    history.sensors[name].push(data.sensors && name in data.sensors ? data.sensors[name] : null);
  });

  while (history.labels.length > MAX_HISTORY){
    history.labels.shift();
    SENSOR_ORDER.forEach(name => history.sensors[name].shift());
  }

  redrawChart();
}

function redrawChart(){
  if (!chart) return;
  const history = currentHistory();
  const unit = SENSOR_UNITS[selectedSensor] || "";

  chart.data.labels = history.labels;
  chart.data.datasets[0].label = unit ? `${selectedSensor} (${unit})` : selectedSensor;
  chart.data.datasets[0].data = history.sensors[selectedSensor] || [];
  const band = referenceBands?.sensors?.[selectedSensor];
  chart.data.datasets[1].data = history.labels.map(() => band ? band.lower : null);
  chart.data.datasets[2].data = history.labels.map(() => band ? band.upper : null);
  chart.update("none");
  const info = document.getElementById('band-info');
  const state = history.bandState;
  const values = history.sensors[selectedSensor] || [];
  const count = state?.counts[selectedSensor] || 0;
  const stale = !state || !Number.isFinite(state.stamp) || Date.now()-state.stamp >= STALE_MS;
  const isOutside = SensorBands.outside(values.at(-1),band);
  const warning = !stale && isOutside === true && count >= (referenceBands?.warning_consecutive_samples || 3);
  info.classList.toggle('warning',warning);
  if (!band) info.textContent = bandLoadFailed ? '기준 범위 준비 실패 · 범위 판단 중지' : '정상 운전 기준 범위 불러오는 중';
  else {
    const status = stale ? '수신 대기·지연 — 현재 범위 판단 중지' : isOutside === null ? '유효한 센서값 없음'
      : warning ? `기준 범위 이탈 경고 · ${count}개 연속` : isOutside ? `범위 이탈 관측 · ${count}/3개` : '기준 범위 내';
    info.textContent = `${selectedSensor} 기준 ${fmtNum(band.lower,3)} ~ ${fmtNum(band.upper,3)} ${unit} · ${status}`;
  }

  const titleEl = document.getElementById("chart-title");
  if (titleEl){
    titleEl.textContent = unit ? `${selectedSensor} 추이 (${unit})` : `${selectedSensor} 추이`;
  }
}

function initChart(){
  const ctx = document.getElementById("trend-chart").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [
        {
          label: selectedSensor,
          data: [],
          borderColor: "#2fe0c4",
          backgroundColor: "rgba(47,224,196,0.08)",
          borderWidth: 2,
          pointRadius: ctx => SensorBands.outside(ctx.raw,referenceBands?.sensors?.[selectedSensor]) ? 3 : 0,
          pointBackgroundColor:'#ffab55',
          segment:{borderColor:ctx => [ctx.p0.parsed.y,ctx.p1.parsed.y].some(v => SensorBands.outside(v,referenceBands?.sensors?.[selectedSensor])) ? '#ffab55' : '#2fe0c4'},
          tension: 0,
          fill: false,
          spanGaps: false,
          order:0,
        },
        {label:'기준 하한',data:[],borderColor:'rgba(80,190,150,.5)',borderWidth:1,borderDash:[4,4],pointRadius:0,fill:false,order:2},
        {label:'정상 운전 기준 범위',data:[],borderColor:'rgba(80,190,150,.5)',backgroundColor:'rgba(80,190,150,.15)',borderWidth:1,borderDash:[4,4],pointRadius:0,fill:1,order:2},
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        tooltip:{filter:item => item.datasetIndex === 0},
        legend: {
          onClick:()=>{},
          labels: { filter:item => item.datasetIndex !== 1, color: "#7c8e9c", font: { family: "IBM Plex Mono", size: 11 }, boxWidth: 10 },
        },
      },
      scales: {
        x: { ticks: { color: "#4d5c68", font: { family: "IBM Plex Mono", size: 10 } }, grid: { color: "#1a2530" } },
        y: { ticks: { color: "#4d5c68", font: { size: 10 } }, grid: { color: "#1a2530" } },
      },
    },
  });
  redrawChart();
}

async function loadReferenceBands(){
  try {
    const response = await fetch(`${API_BASE}/api/v1/sensors/reference-bands`);
    if (!response.ok) throw new Error('기준 범위 응답 오류');
    const value = await response.json();
    if (!SENSOR_ORDER.every(s => Number.isFinite(value.sensors?.[s]?.lower) && Number.isFinite(value.sensors?.[s]?.upper))) throw new Error('센서 기준 누락');
    referenceBands = value;
    bandLoadFailed = false;
    document.getElementById('band-note').textContent = `음영: 정상 운전 ${value.cycle_count}개 사이클의 1초 평균 하위 1%~상위 99% 범위 · 주황색: 이탈 · 3개 연속 이탈 시 경고. 기준 고정 · 안전 한계/AI 고장 판단 아님 · 기준 표본이 적어 시연용`;
  } catch(error){ bandLoadFailed = true; }
  redrawChart();
}

// ---------- Unity로 데이터 전달 (web-unity.md 규격) ----------
function sendToUnity(payload){
  if (!unityInstance) return;
  try {
    unityInstance.SendMessage(UNITY_OBJECT_NAME, UNITY_METHOD_NAME, JSON.stringify(payload));
  } catch (err) {
    console.error("Unity SendMessage(ApplyWebState) 실패:", err);
  }
}

function clearUnity(){
  if (!unityInstance) return;
  try {
    unityInstance.SendMessage(UNITY_OBJECT_NAME, UNITY_CLEAR_METHOD);
  } catch (err) {
    console.error("Unity SendMessage(ClearState) 실패:", err);
  }
}

let unityCleared = false; // 연속으로 여러 번 ClearState를 호출하지 않기 위한 플래그
let lastPayload = null;   // 설비를 바꿨을 때 즉시 다시 그리기 위해 마지막 응답을 보관

/**
 * API 응답에서 현재 선택된 설비의 데이터만 골라낸다.
 * - equipment_states 배열이 오면 selectedEquipmentId와 일치하는 항목을 사용
 * - 그런 배열이 없으면(현재 상태) 설비 구분 없는 단일 데이터를 그대로 사용
 *   -> V5가 나중에 설비별 데이터를 보내기 시작해도 코드 수정 없이 동작
 */
function pickEquipmentData(payload){
  if (Array.isArray(payload.equipment_states) && payload.equipment_states.length > 0){
    const found = payload.equipment_states.find(s => s.equipment_id === selectedEquipmentId);
    const target = found || payload.equipment_states[0];
    return {
      ...target,
      event_id: payload.event_id,
      run_id: payload.run_id,
      segment_id: target.segment_id ?? payload.segment_id,
      elapsed_sec: payload.elapsed_sec,
      generated_at: target.generated_at || payload.generated_at,
      _isFallback: !found,  // 선택한 설비를 못 찾아 첫 번째로 대체한 경우
    };
  }
  // 설비 구분이 아직 없는 단계: 하나의 데이터를 모든 설비가 공유
  return { ...payload, _isShared: true };
}

function renderSelectedEquipment(){
  const labelEl = document.getElementById("unit-label");
  if (labelEl) labelEl.textContent = selectedEquipmentId.toUpperCase();

  // 설비를 바꾸면 그 설비의 이력으로 차트를 다시 그린다
  redrawChart();

  // 마지막으로 받은 데이터가 있으면 즉시 화면 갱신 (다음 폴링까지 기다리지 않도록)
  if (lastPayload){
    const view = pickEquipmentData(lastPayload);
    renderTelemetry(view.sensors);
    renderDiagnosis(view.prediction);
  }
}

// Unity 3D 화면에서 머신을 클릭하면 이 이벤트가 날아온다
window.addEventListener("hydrotwin-equipment-selected", (event) => {
  const id = event.detail && event.detail.equipmentId;
  if (!id || id === selectedEquipmentId) return;
  selectedEquipmentId = id;
  console.log("선택된 설비:", selectedEquipmentId);
  renderSelectedEquipment();
});

async function poll(){
  try {
    const res = await fetch(`${API_BASE}/api/v1/state/latest`);
    if (!res.ok) {
      if (res.status === 503){
        document.getElementById("conn-text").textContent = "Raw Consumer 대기 중";
        document.getElementById("conn-dot").classList.remove("live");
        if (!unityCleared){ clearUnity(); unityCleared = true; }
      }
      return;
    }
    const payload = await res.json();
    lastPayload = payload;
    const data = pickEquipmentData(payload);

    // event_id가 바뀐 경우에만 "새 데이터"로 취급 (수신 횟수, 차트 점 추가)
    const eventKey = `${payload.run_id || ''}:${payload.event_id}`;
    const isNewEvent = eventKey !== lastEventId;
    if (isNewEvent){
      lastEventId = eventKey;
      lastChangeAt = Date.now();
      receivedCount += 1;
      document.getElementById("poll-count").textContent = receivedCount;
      updateChart(data);

      // Unity에는 원본 응답을 그대로 전달 (설비 3대를 Unity가 각각 처리하도록)
      sendToUnity(payload);
      unityCleared = false;
    }

    renderTelemetry(data.sensors);
    renderDiagnosis(data.prediction);
    updateHeader(data);
  } catch (err) {
    document.getElementById("conn-text").textContent = "API 연결 실패";
    document.getElementById("conn-dot").classList.remove("live");
    if (!unityCleared){ clearUnity(); unityCleared = true; }
    console.error("poll error:", err);
  } finally {
    redrawChart();
  }
}

function loadUnity(){
  const statusEl = document.getElementById("unity-status");
  const canvas = document.getElementById("unity-canvas");
  const buildFolder = UNITY_BUILD_FOLDER;
  // 새 빌드와 이전 브라우저 캐시의 파일이 섞이지 않도록 같은 버전을 붙인다.
  const buildVersion = '20260903-ai-labels-2';
  const loaderUrl = `${buildFolder}/pro-build.loader.js?v=${buildVersion}`;

  const config = {
    dataUrl: `${buildFolder}/pro-build.data.gz?v=${buildVersion}`,
    frameworkUrl: `${buildFolder}/pro-build.framework.js.gz?v=${buildVersion}`,
    codeUrl: `${buildFolder}/pro-build.wasm.gz?v=${buildVersion}`,
    streamingAssetsUrl: "StreamingAssets",
    companyName: "HydroTwin Team",
    productName: "HydroTwin",
    productVersion: "0.1",
    cacheControl: () => 'no-store',
  };

  const script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = () => {
    if (typeof createUnityInstance !== "function"){
      statusEl.textContent = "Unity 로더 스크립트는 불러왔지만 createUnityInstance를 찾을 수 없음";
      statusEl.classList.add("error");
      return;
    }
    createUnityInstance(canvas, config, (progress) => {
      statusEl.textContent = `Unity 로딩 중... ${Math.round(progress * 100)}%`;
    }).then((instance) => {
      unityInstance = instance;
      statusEl.classList.add("hidden");
    }).catch((err) => {
      statusEl.textContent = "Unity 인스턴스 생성 실패";
      statusEl.classList.add("error");
      console.error("createUnityInstance 실패:", err);
    });
  };
  script.onerror = () => {
    statusEl.textContent = `Unity 빌드 파일을 못 찾음 (${loaderUrl}). web/${UNITY_BUILD_FOLDER}/ 폴더에 빌드 파일이 있는지 확인하세요.`;
    statusEl.classList.add("error");
  };
  document.body.appendChild(script);
}

initChart();
loadReferenceBands();
setInterval(() => { if (!referenceBands) loadReferenceBands(); },30000);
document.getElementById("unit-label").textContent = selectedEquipmentId.toUpperCase();
loadUnity();
poll();
setInterval(poll, POLL_INTERVAL_MS);
</script>
